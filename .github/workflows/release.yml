name: Release
on:
  push:
    tags: ['v*']
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: Cross-compile
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -o dist/dsn-linux-amd64 ./cmd/dsn
          GOOS=linux GOARCH=arm64 go build -o dist/dsn-linux-arm64 ./cmd/dsn
          GOOS=darwin GOARCH=amd64 go build -o dist/dsn-darwin-amd64 ./cmd/dsn
          GOOS=windows GOARCH=amd64 go build -o dist/dsn-windows-amd64.exe ./cmd/dsn
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*