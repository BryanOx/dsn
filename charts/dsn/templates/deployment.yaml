{{- if and (not .Values.statefulset.enabled) (not .Values.persistence.enabled) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dsn.fullname" . }}
  labels:
    {{- include "dsn.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "dsn.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "dsn.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "dsn.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: p2p
              containerPort: {{ .Values.config.p2p.port }}
              protocol: TCP
            - name: rpc
              containerPort: {{ .Values.config.rpc.port }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.config.metrics.port }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: DSN_CHAIN_ID
              value: {{ .Values.config.chain.id | quote }}
            - name: DSN_P2P_PORT
              value: {{ .Values.config.p2p.port | quote }}
            - name: DSN_RPC_PORT
              value: {{ .Values.config.rpc.port | quote }}
            - name: DSN_METRICS_PORT
              value: {{ .Values.config.metrics.port | quote }}
            - name: DSN_P2P_SEEDS
              value: {{ .Values.config.p2p.seeds | quote }}
            - name: DSN_P2P_PERSISTENT_PEERS
              value: {{ .Values.config.p2p.persistentPeers | quote }}
            - name: DSN_CONSENSUS_TIMEOUT_PROPOSE
              value: {{ .Values.config.consensus.timeoutPropose | quote }}
            - name: DSN_CONSENSUS_TIMEOUT_PRECOMMIT
              value: {{ .Values.config.consensus.timeoutPrecommit | quote }}
            - name: DSN_CONSENSUS_SKIP_TIMEOUT_COMMIT
              value: {{ .Values.config.consensus.skipTimeoutCommit | quote }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}