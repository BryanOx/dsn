apiVersion: v1
kind: Service
metadata:
  name: {{ include "dsn.fullname" . }}
  labels:
    {{- include "dsn.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: p2p
      name: p2p
      protocol: TCP
    - port: {{ .Values.service.port }}
      targetPort: rpc
      name: rpc
      protocol: TCP
    - port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      name: metrics
      protocol: TCP
  selector:
    {{- include "dsn.selectorLabels" . | nindent 4 }}