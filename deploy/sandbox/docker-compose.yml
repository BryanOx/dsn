version: '3.8'

services:
  validator-0:
    build:
      context: ../..
      dockerfile: dev/localnet/Dockerfile
    image: dsn/node:sandbox
    container_name: dsn-validator-0
    ports:
      - "30333:30333"
      - "8545:8545"
      - "9090:9090"
    volumes:
      - validator-0-data:/data
    environment:
      - DSN_NODE_ID=validator-0
      - DSN_NETWORK=sandbox
      - DSN_CHAIN_ID=dsn-sandbox-1
      - DSN_BOOTSTRAP_PEERS=
      - DSN_RPC_ADDR=:8545
      - DSN_P2P_PORT=30333
      - DSN_METRICS_PORT=9090
    networks:
      - dsn-sandbox
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8545/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  validator-1:
    build:
      context: ../..
      dockerfile: dev/localnet/Dockerfile
    image: dsn/node:sandbox
    container_name: dsn-validator-1
    ports:
      - "30334:30333"
      - "8546:8545"
      - "9091:9090"
    volumes:
      - validator-1-data:/data
    environment:
      - DSN_NODE_ID=validator-1
      - DSN_NETWORK=sandbox
      - DSN_CHAIN_ID=dsn-sandbox-1
      - DSN_BOOTSTRAP_PEERS=validator-0:30333
      - DSN_RPC_ADDR=:8545
      - DSN_P2P_PORT=30333
      - DSN_METRICS_PORT=9090
    networks:
      - dsn-sandbox
    depends_on:
      validator-0:
        condition: service_healthy
    restart: unless-stopped

  validator-2:
    build:
      context: ../..
      dockerfile: dev/localnet/Dockerfile
    image: dsn/node:sandbox
    container_name: dsn-validator-2
    ports:
      - "30335:30333"
      - "8547:8545"
      - "9092:9090"
    volumes:
      - validator-2-data:/data
    environment:
      - DSN_NODE_ID=validator-2
      - DSN_NETWORK=sandbox
      - DSN_CHAIN_ID=dsn-sandbox-1
      - DSN_BOOTSTRAP_PEERS=validator-0:30333
      - DSN_RPC_ADDR=:8545
      - DSN_P2P_PORT=30333
      - DSN_METRICS_PORT=9090
    networks:
      - dsn-sandbox
    depends_on:
      validator-0:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: dsn-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../monitoring/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    networks:
      - dsn-sandbox
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: dsn-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../../monitoring/grafana/dsn-dashboard.json:/etc/grafana/provisioning/dashboards/dsn-dashboard.json:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=dsn-sandbox
      - GF_INSTALL_PLUGINS=
    networks:
      - dsn-sandbox
    depends_on:
      - prometheus
    restart: unless-stopped

networks:
  dsn-sandbox:
    driver: bridge

volumes:
  validator-0-data:
  validator-1-data:
  validator-2-data:
  prometheus-data:
  grafana-data: