# DSN Sandbox Seed Node Configuration
# This node serves as a bootstrap peer for the sandbox network

[P2P]
Port = 30333
MaxPeers = 100
EnableDiscovery = true
BootstrapPeers = []

[Validator]
Enabled = false  # Seed nodes don't validate

[RPC]
Port = 8545
Enabled = true

[Metrics]
Port = 9090
Enabled = true