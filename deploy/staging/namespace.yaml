apiVersion: v1
kind: Namespace
metadata:
  name: dsn-staging
  labels:
    # Enable monitoring discovery
    monitoring: "enabled"
    # Prometheus scrape target
    prometheus.io/scrape: "true"
    # Environment label
    environment: staging
    # App.kubernetes.io labels for consistency
    app.kubernetes.io/name: dsn
    app.kubernetes.io/instance: dsn-staging
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: dsn
    # Security labels
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    description: "DSN Staging - 3-Validator DSN Cluster for testing"