# Light profile configuration for quick CI soak tests
# 10 TPS, 1 hour duration, 100 accounts
profile: light
tps: 10
duration: 1h
num_accounts: 100
log_interval: 30s

# Profile-specific settings
profiles:
  light:
    tps: 10
    num_accounts: 100
  moderate:
    tps: 100
    num_accounts: 1000
  heavy:
    tps: 1000
    num_accounts: 10000